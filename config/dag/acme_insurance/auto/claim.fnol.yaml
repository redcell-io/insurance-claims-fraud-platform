# DAG config for (tenant=acme_insurance, product=auto, event_type=claim.fnol),
# read by Orchestration Service (see internal/dag/loader.go). Shape follows
# DESIGN.md §6.1 exactly.
#
# v2: added claimant_id_hash and policy_lookup to the enrichment group
# (remaining enrichment services, DESIGN.md §4 items 3/5) — both join the
# existing group unchanged, per DECISIONS.md #10 (staged executor, no
# depends_on changes needed). v1 had only address_normalize.
#
# v3: kafka-publisher is a real publish now, not a log stub (DECISIONS.md
# #15) — added on_failure: skip so a broker outage degrades the response
# instead of fail_fast-ing a request whose score has already been
# computed by this point.
#
# v4: added max_retries to the three enrichment nodes — timeout_ms was
# already here but never enforced until this pass (see DECISIONS.md's
# entry for the observability/resilience layer); a transient failure now
# gets one retry, still bounded by the same timeout_ms per attempt,
# before falling back to on_failure.
tenant_id: acme_insurance
product: auto
event_type: claim.fnol
version: 4
timeout_ms: 250

nodes:
  - id: claimant_id_hash
    service: claimant-id-hashing-svc
    group: enrichment
    timeout_ms: 40
    max_retries: 1
    on_failure: fail_fast

  - id: address_normalize
    service: address-normalization-svc
    group: enrichment
    timeout_ms: 40
    max_retries: 1
    on_failure: skip

  - id: policy_lookup
    service: policy-lookup-svc
    group: enrichment
    timeout_ms: 40
    max_retries: 1
    on_failure: degrade

  - id: model_score
    service: model-service
    depends_on: [enrichment]
    timeout_ms: 80

  - id: publish
    service: kafka-publisher
    depends_on: [model_score]
    timeout_ms: 100
    on_failure: skip
