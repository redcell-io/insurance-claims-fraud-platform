spring:
  application:
    name: address-normalization-svc

# Custom property (not Spring's own grpc.* namespace) — read by
# GrpcServerLifecycle. Default 9092 matches ADDRESS_NORMALIZATION_ADDR's
# default in orchestration-service.
app:
  grpc:
    port: 9092
  # /metrics port (DECISIONS.md #18) — grpc.port + 100, same offset used
  # for every non-claims-gateway service so it's easy to remember.
  metrics:
    port: 9192
